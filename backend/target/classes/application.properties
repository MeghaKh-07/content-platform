spring.application.name=content-platform

# --- Local dev DB: in-memory H2 (no setup needed) ---
spring.datasource.url=jdbc:h2:mem:contentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- GraphQL ---
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.cors.allowed-origins=http://localhost:5173
spring.graphql.cors.allowed-methods=GET,POST

# ---------------------------------------------------------------
# For production on GCP Cloud SQL (Postgres), comment out the H2
# block above and use instead:
#
# spring.datasource.url=jdbc:postgresql://<CLOUD_SQL_HOST>:5432/contentdb
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=update
# ---------------------------------------------------------------
